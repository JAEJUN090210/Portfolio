server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # 라우트별로 미리 만들어 둔 HTML(/projects/foo → projects/foo.html)을 먼저 찾고, 없으면 SPA 진입점으로 보냅니다.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }

  # 해시가 붙은 빌드 산출물은 영구 캐시
  location ~* \.(js|css|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 이미지는 파일명이 그대로라 교체될 수 있으므로 한 달만 캐시
  location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
    expires 30d;
    try_files $uri =404;
  }
}
